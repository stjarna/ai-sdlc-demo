schema_version: '0.1'
request_id: REQ-0001
operations:
- id: c900d88f-fd38-4c37-afc6-f0e1843909a0
  base_revision: 41e61df7193689d1b59cc04799e9c1d05c91bb35b301d2a74a37348d351e64ff
  records:
  - id: D-0001
    kind: user_statement
    topic: business_need
    text: Littlelist users should be able to optionally assign a due date to a task,
      view that date in their task list and manage it when editing a task. Existing
      tasks without due dates must remain supported.
    source:
      actor: user
      quote: Littlelist users should be able to optionally assign a due date to a
        task, view that date in their task list and manage it when editing a task.
        Existing tasks without due dates must remain supported.
  - id: D-0002
    kind: user_statement
    topic: due_date_management
    text: Due dates are optional. Users can assign one during creation or editing,
      see it clearly, and change or remove it later.
    source:
      actor: user
      quote: '- Optional due dates.

        - Assigning a due date when creating or editing tasks.

        - Displaying assigned dates clearly.

        - Changing or removing previously assigned dates.'
  - id: D-0003
    kind: user_statement
    topic: regression_scope
    text: Existing tasks without dates and existing CRUD/completion behavior must
      continue working.
    source:
      actor: user
      quote: '- Preserving tasks that have no due date.

        - Preserving existing CRUD and completion behavior.'
  - id: D-0004
    kind: user_statement
    topic: persistence
    text: Assigned due dates persist across application restarts.
    source:
      actor: user
      quote: '- Persisting due dates across application restarts.'
  - id: D-0005
    kind: user_statement
    topic: experience
    text: The feature should be intuitive and visually polished, consistent with Littlelist.
    source:
      actor: user
      quote: '- An intuitive and visually polished experience consistent with Littlelist.'
  - id: D-0006
    kind: user_statement
    topic: scope
    text: Keep the change appropriately scoped for a local single-user demonstrator.
    source:
      actor: user
      quote: Keep the feature appropriately scoped for a local single-user demonstrator.
  - id: D-0007
    kind: ai_assumption
    topic: permitted_dates
    text: 'Proposed policy, awaiting human confirmation: permit any valid calendar
      date, including today and past dates. This does not yet define overdue presentation
      or calendar-date interpretation.'
    source:
      actor: ai
  - id: D-0008
    kind: question
    topic: permitted_dates
    text: Should users be allowed to assign a valid calendar date in the past, as
      well as today or a future date? I recommend allowing all three; this avoids
      preventing users from recording tasks that are already overdue.
    source:
      actor: ai
- id: ebff660b-f9e6-4fc1-ba42-38c686608a65
  base_revision: fd2cc884e21f1ad6c7bb9b4133fbda0e6bf3e9c0b67a39b1afdbf2b0e55ab086
  records:
  - id: D-0009
    kind: human_decision
    topic: permitted_dates
    text: Due dates remain optional. Any valid calendar date is permitted, including
      past dates, today and future dates. A date must not be rejected simply because
      it is in the past.
    source:
      actor: user
      quote: 'Yes. Allow any valid calendar date, including past dates, today and
        future dates.

        Due dates are optional. Do not reject a date simply because it is in the past.'
    action: answer
    target: D-0008
  - id: D-0010
    kind: human_decision
    topic: permitted_dates
    text: Explicitly confirms the proposed permission for past, current and future
      valid calendar dates; other proposed semantics remain undecided.
    source:
      actor: user
      quote: 'Yes. Allow any valid calendar date, including past dates, today and
        future dates.

        Due dates are optional. Do not reject a date simply because it is in the past.'
    action: confirm
    target: D-0007
  - id: D-0011
    kind: ai_assumption
    topic: overdue_presentation
    text: 'Proposed, unconfirmed: an unfinished task is overdue only when its due
      date is earlier than today on the user device. Show an explicit Overdue label
      with a subtle warning color; today is not overdue. Preserve existing list ordering.'
    source:
      actor: ai
  - id: D-0012
    kind: ai_assumption
    topic: calendar_interpretation
    text: 'Proposed, unconfirmed: due dates are calendar dates without a time, interpreted
      against the device local calendar, with no UTC conversion that shifts the selected
      day. Reject impossible calendar dates, preserving the previous saved value and
      showing a clear validation message.'
    source:
      actor: ai
  - id: D-0013
    kind: ai_assumption
    topic: completed_due_dates
    text: 'Proposed, unconfirmed: completing a task retains its due date but removes
      overdue emphasis. Reopening the task restores overdue indication when the retained
      date is before today.'
    source:
      actor: ai
  - id: D-0014
    kind: ai_assumption
    topic: date_editing
    text: 'Proposed, unconfirmed: date editing and clearing use existing autosave
      behavior. Clearing removes the optional date. Cancel discards only unsaved or
      invalid drafts; previously autosaved changes remain saved.'
    source:
      actor: ai
  - id: D-0015
    kind: question
    topic: remaining_date_behavior
    text: 'Do you confirm the proposed defaults together: overdue only for unfinished
      tasks dated before device-local today, text plus subtle warning color without
      reordering; date-only local-calendar interpretation with invalid dates rejected
      while preserving the saved value; completed tasks retain dates without overdue
      emphasis, restored on reopening; and edit/clear follows existing autosave and
      cancel-draft behavior?'
    source:
      actor: ai
